<svg xmlns="http://www.w3.org/2000/svg" width="824" height="552" viewBox="0 0 824 552" role="img" aria-labelledby="title description">
<title id="title">Faction BBS paged login preview</title>
<desc id="description">Original long-form login template, reference palette. Not an emulator screenshot or final identity-art acceptance.</desc>
<rect width="824" height="552" fill="#101018"/>
<text x="12" y="29" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ╓────────────────────────────────────────────────────────────────╖</text>
<text x="12" y="51" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  / FACTION /                       02 / THROUGH THE RELAY      ║</text>
<text x="12" y="73" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ╟────────────────────────────────────────────────────────────────╢</text>
<text x="12" y="95" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  ░▒▓  ────────┬───────────┬───────────┬─────────  ▓▒░          ║</text>
<text x="12" y="117" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║              │           │           │                         ║</text>
<text x="12" y="139" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  CARRIER ────┘       RELAY└──────┐    └── COMMUNITY            ║</text>
<text x="12" y="161" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║                                 │                              ║</text>
<text x="12" y="183" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  Local voices, late nights, another connection.                ║</text>
<text x="12" y="205" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  Files to share. A game waiting behind a door.                 ║</text>
<text x="12" y="227" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║                                                                ║</text>
<text x="12" y="249" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  Your sysop sets the mood; your community gives it life.       ║</text>
<text x="12" y="271" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  Every line belongs to the people who wrote it.                ║</text>
<text x="12" y="293" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║                                                                ║</text>
<text x="12" y="315" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  --/    \------/    \------/    \------/    \--                ║</text>
<text x="12" y="337" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ║  SIGNAL RELAY / PAGE 2 OF 3                                    ║</text>
<text x="12" y="359" fill="#b482ce" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="690" lengthAdjust="spacingAndGlyphs">   ╙────────────────────────────────────────────────────────────────╜</text>
<text x="12" y="403" fill="#c5c5d0" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="800" lengthAdjust="spacingAndGlyphs">Art page 2/3. Enter: next; S+Enter: skip:                                       </text>
