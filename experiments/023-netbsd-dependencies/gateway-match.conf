# Fixture for the disposable VM only. Append after global sshd settings.
# Account/key setup and base listener policy are deliberately outside this fragment.
Match User bbstest
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/libexec/faction-netbsd-probe serve /var/db/faction-probe/gateway.db
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY yes
    PermitUserRC no
    X11Forwarding no
