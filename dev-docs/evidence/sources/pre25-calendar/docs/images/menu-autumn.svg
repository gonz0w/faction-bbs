<svg xmlns="http://www.w3.org/2000/svg" width="824" height="420" viewBox="0 0 824 420" role="img" aria-labelledby="title description">
<title id="title">Faction BBS main-menu authoring preview</title>
<desc id="description">Reference palette, not an emulator screenshot. Arrow lightbar, hotkeys, action descriptions and classic recovery instructions.</desc>
<rect width="824" height="420" fill="#101018"/>
<text x="32" y="29" fill="#a0e5eb" font-family="monospace" font-size="16" font-weight="700" xml:space="preserve" textLength="760" lengthAdjust="spacingAndGlyphs">Faction BBS                                                                 </text>
<text x="12" y="51" fill="#d8b46b" font-family="monospace" font-size="16" font-weight="400" xml:space="preserve" textLength="800" lengthAdjust="spacingAndGlyphs">  Autumn frequencies.                                                           </text>
