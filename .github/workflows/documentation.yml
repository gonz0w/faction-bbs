name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_mail:
    name: Optional native mail
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the public repository revision
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate the optional member-device checkpoint path
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/faction-native-mail
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          python3 tools/check_omemo_dependencies.py
          cargo clippy -p faction-client -p faction-omemo --features faction-client/native-mail --all-targets --release --locked -- -D warnings
          cargo test -p faction-client -p faction-omemo --features faction-client/native-mail --all-targets --release --locked -- --test-threads=1
          cargo build -p faction-client --features native-mail --bin faction-client --example checkpoint_ui_fixture --release --locked
          python3 tools/probe_checkpoint_ui.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture"
          python3 tools/probe_unread_mail.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --output "$RUNNER_TEMP/local-unread-mail.json"
          mkdir -m 700 "$RUNNER_TEMP/inbox-owned"
          printf '%s\n' 'Owned issue219 inbox controls' > "$RUNNER_TEMP/inbox-owned/OWNERSHIP"
          python3 tools/probe_mail_inbox.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --owned-root "$RUNNER_TEMP/inbox-owned" --output "$RUNNER_TEMP/inbox-native.json"
          python3 tools/probe_picker_home_mail.py --client "$CARGO_TARGET_DIR/release/faction-client" --unsupported --output "$RUNNER_TEMP/picker-native-only.json"
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu --features faction-client/network-mail > /dev/null
          cargo metadata --locked --format-version 1 --filter-platform aarch64-unknown-netbsd --features faction-client/network-mail > /dev/null
          cargo metadata --locked --format-version 1 --filter-platform aarch64-apple-darwin --features faction-client/network-mail > /dev/null
          python3 tools/check_network_mail_dependencies.py
          python3 tools/check_xmpp_transport_dependencies.py
          cargo clippy -p faction-client -p faction-omemo --features faction-client/network-mail --all-targets --release --locked -- -D warnings
          cargo test -p faction-client -p faction-omemo --features faction-client/network-mail --all-targets --release --locked -- --test-threads=1
          cargo build -p faction-client --features network-mail --bin faction-client --example checkpoint_ui_fixture --example home_mail_fixture --example mail_reply_fixture --example mail_correspondents_fixture --release --locked
          mkdir -m 700 "$RUNNER_TEMP/reply-owned"
          printf 'CI owned reply fixtures\n' > "$RUNNER_TEMP/reply-owned/OWNED"
          python3 tools/probe_mail_reply.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/mail_reply_fixture" --owned-root "$RUNNER_TEMP/reply-owned" --output "$RUNNER_TEMP/reply-classic.json"
          python3 tools/probe_mail_reply.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/mail_reply_fixture" --owned-root "$RUNNER_TEMP/reply-owned" --unicode --output "$RUNNER_TEMP/reply-unicode.json"
          mkdir -m 700 "$RUNNER_TEMP/correspondents-owned"
          printf 'CI owned correspondent fixtures\n' > "$RUNNER_TEMP/correspondents-owned/OWNED"
          python3 tools/probe_mail_correspondents.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/mail_correspondents_fixture" --owned-root "$RUNNER_TEMP/correspondents-owned" --output "$RUNNER_TEMP/correspondents-classic.json"
          python3 tools/probe_mail_correspondents.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/mail_correspondents_fixture" --owned-root "$RUNNER_TEMP/correspondents-owned" --unicode --output "$RUNNER_TEMP/correspondents-unicode.json"
          python3 tools/probe_mail_inbox.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --owned-root "$RUNNER_TEMP/inbox-owned" --online --output "$RUNNER_TEMP/inbox-network.json"
          python3 tools/probe_home_ui.py --client "$CARGO_TARGET_DIR/release/faction-client" --checkpoint-fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --mail-fixture "$CARGO_TARGET_DIR/release/examples/home_mail_fixture"
          python3 tools/probe_home_archive_ui.py --client "$CARGO_TARGET_DIR/release/faction-client" --fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --output "$RUNNER_TEMP/archive-ui.json"
          python3 tools/probe_picker_home_mail.py --client "$CARGO_TARGET_DIR/release/faction-client" --checkpoint-fixture "$CARGO_TARGET_DIR/release/examples/checkpoint_ui_fixture" --mail-fixture "$CARGO_TARGET_DIR/release/examples/home_mail_fixture" --output "$RUNNER_TEMP/picker-home-mail.json"
          cargo fmt --manifest-path crates/faction-xmpp/Cargo.toml -- --check
          cargo clippy --manifest-path crates/faction-xmpp/Cargo.toml --all-targets --release --locked -- -D warnings
          cargo test --manifest-path crates/faction-xmpp/Cargo.toml --all-targets --release --locked
          cargo build --manifest-path crates/faction-xmpp/Cargo.toml --example transport_fixture --release --locked
          python3 tools/probe_home_transport.py --binary "$CARGO_TARGET_DIR/release/examples/transport_fixture"
          cargo fmt --manifest-path experiments/208-xmpp-transport/Cargo.toml -- --check
          cargo clippy --manifest-path experiments/208-xmpp-transport/Cargo.toml --all-targets --release --locked -- -D warnings
          cargo test --manifest-path experiments/208-xmpp-transport/Cargo.toml --all-targets --release --locked
          cargo build --manifest-path experiments/208-xmpp-transport/Cargo.toml --release --locked
          python3 tools/probe_xmpp_transport.py --binary "$CARGO_TARGET_DIR/release/faction-xmpp-probe"
          python3 tools/check_provider_auth_dependencies.py
          cargo fmt --manifest-path experiments/270-provider-auth/Cargo.toml -- --check
          cargo clippy --manifest-path experiments/270-provider-auth/Cargo.toml --all-targets --release --locked -- -D warnings
          cargo test --manifest-path experiments/270-provider-auth/Cargo.toml --release --locked -- --test-threads=1
  provider:
    name: Optional attachment provider
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the public repository revision
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Warm the selected native attachment source graphs
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/faction-provider
          CARGO_BUILD_JOBS: 2
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo metadata --locked --manifest-path Cargo.toml --format-version 1 --filter-platform x86_64-unknown-linux-gnu > /dev/null
          cargo metadata --locked --manifest-path Cargo.toml --format-version 1 --filter-platform aarch64-unknown-netbsd > /dev/null
          cargo metadata --locked --manifest-path Cargo.toml --format-version 1 --filter-platform aarch64-apple-darwin > /dev/null
