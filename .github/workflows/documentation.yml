name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the public repository revision
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate documentation, policies, and archive
        run: |
          python3 tools/check_repository.py
          python3 tools/model_link_budget.py --check
          python3 tools/measure_text_replay.py --check
          python3 tools/measure_buffer_probe.py --check
          python3 tools/measure_native_sessions.py --check
          python3 experiments/009-local-storage/probe.py --check
          python3 experiments/023-netbsd-dependencies/verify_evidence.py
          python3 tools/probe_lua_boundary.py --check
          python3 tools/check_evidence_sources.py
          python3 tools/check_original_games_evidence.py
          python3 tools/check_file_area_evidence.py
          python3 tools/check_native_client_evidence.py
          python3 tools/check_room_reader_evidence.py
          python3 tools/check_post_metadata_evidence.py
          python3 tools/check_authored_articles_evidence.py
          python3 tools/check_broader_articles_evidence.py
          python3 tools/check_unicode_subjects_evidence.py
          python3 tools/check_modern_terminals_evidence.py
          python3 tools/check_kitty_graphics_evidence.py
          python3 tools/check_terminal_compatibility_evidence.py
          python3 tools/check_menu_themes_evidence.py
          python3 tools/check_seasonal_themes_evidence.py
          python3 tools/check_custom_menus_evidence.py
          python3 tools/check_login_paging_evidence.py
          python3 tools/check_nightwire_evidence.py
          python3 tools/check_artwork_terminal_evidence.py
          python3 tools/check_operator_evidence.py
          python3 tools/check_operator_host_evidence.py
          python3 tools/check_operator_recovery_evidence.py
          python3 tools/check_directory_evidence.py
          python3 tools/check_mail_proof_evidence.py
          python3 tools/check_netbsd_application_evidence.py
          python3 tools/check_service_evidence.py
          python3 tools/check_memory_evidence.py
          python3 tools/check_shared_evidence.py
          python3 tools/check_transport_evidence.py
          python3 tools/check_headroom_evidence.py
          python3 tools/check_ui_evidence.py
          python3 tools/check_integrated_evidence.py
          python3 tools/check_confinement_evidence.py
          python3 tools/check_isolation_evidence.py
          python3 tools/check_admission_evidence.py
          python3 tools/check_sustained_evidence.py
          python3 tools/check_lookup_evidence.py
          python3 tools/check_global_evidence.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate optional Lua game evaluator and examples
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends liblua5.4-dev
          python3 tools/build_lua_doors.py --include /usr/include/lua5.4 --library lua5.4 --output "$RUNNER_TEMP/faction-doors"
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -fanalyzer -I/usr/include/lua5.4 -fsyntax-only native/faction-doors/main.c
          sudo install -d -o root -g root -m 755 "$RUNNER_TEMP/faction-door-fixtures"
          sudo install -o root -g root -m 644 doors/examples/*.lua tools/fixtures/lua-doors/*.lua "$RUNNER_TEMP/faction-door-fixtures/"
          python3 tools/smoke_lua_worker.py --binary "$RUNNER_TEMP/faction-doors" --scripts "$RUNNER_TEMP/faction-door-fixtures"
      - name: Validate the local Rust core and real terminal flow
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/faction-target
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo fmt --manifest-path experiments/055-shared-board/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/058-transport-memory/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/058-headroom/Cargo.toml -- --check
          cargo fmt --manifest-path experiments/055-shared-ui/Cargo.toml -- --check
          python3 tools/check_ui_dependencies.py
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/ui" cargo clippy --manifest-path experiments/055-shared-ui/Cargo.toml --all-targets --release --locked -- -D warnings
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/ui" cargo test --manifest-path experiments/055-shared-ui/Cargo.toml --release --locked
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/ui" cargo build --manifest-path experiments/055-shared-ui/Cargo.toml --release --locked
          python3 tools/check_headroom_dependencies.py
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/headroom" cargo clippy --manifest-path experiments/058-headroom/Cargo.toml --all-targets --release --locked -- -D warnings
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/headroom" cargo test --manifest-path experiments/058-headroom/Cargo.toml --release --locked
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/headroom" cargo build --manifest-path experiments/058-headroom/Cargo.toml --release --locked
          python3 tools/check_transport_dependencies.py
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/transport" cargo clippy --manifest-path experiments/058-transport-memory/Cargo.toml --all-targets --release --locked -- -D warnings
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/transport" cargo build --manifest-path experiments/058-transport-memory/Cargo.toml --release --locked
          python3 tools/check_shared_dependencies.py
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/shared" cargo clippy --manifest-path experiments/055-shared-board/Cargo.toml --all-targets --release --locked -- -D warnings
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/shared" cargo build --manifest-path experiments/055-shared-board/Cargo.toml --release --locked
          python3 tools/check_rust_dependencies.py
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
          cargo test --workspace --locked --release
          cargo build --workspace --locked --release
          cargo build -p faction-terminal --examples --release --locked
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --output "$RUNNER_TEMP/menu-base.svg"
          cmp docs/images/menu-base.svg "$RUNNER_TEMP/menu-base.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --season themes/seasons/autumn --output "$RUNNER_TEMP/menu-autumn.svg"
          cmp docs/images/menu-autumn.svg "$RUNNER_TEMP/menu-autumn.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --columns 40 --output "$RUNNER_TEMP/menu-compact.svg"
          cmp docs/images/menu-compact.svg "$RUNNER_TEMP/menu-compact.svg"
          python3 tools/smoke_operator.py "$CARGO_TARGET_DIR/release/faction-sysop"
          python3 tools/smoke_directory.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_backup_recovery.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-sysop"
          python3 tools/build_nightwire.py --check
          python3 tools/check_nightwire.py "$CARGO_TARGET_DIR/release/examples/preview_theme"
          python3 tools/smoke_nightwire.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_login_paging.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/longform --login --page 1 --output "$RUNNER_TEMP/login-longform-1.svg"
          cmp docs/images/login-longform-1.svg "$RUNNER_TEMP/login-longform-1.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/longform --login --page 2 --output "$RUNNER_TEMP/login-longform-2.svg"
          cmp docs/images/login-longform-2.svg "$RUNNER_TEMP/login-longform-2.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/longform --login --page 3 --output "$RUNNER_TEMP/login-longform-3.svg"
          cmp docs/images/login-longform-3.svg "$RUNNER_TEMP/login-longform-3.svg"
          python3 tools/smoke_custom_menus.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/grid --output "$RUNNER_TEMP/menu-grid.svg"
          cmp docs/images/menu-grid.svg "$RUNNER_TEMP/menu-grid.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/grid --login --output "$RUNNER_TEMP/login-grid.svg"
          cmp docs/images/login-grid.svg "$RUNNER_TEMP/login-grid.svg"
          python3 tools/smoke_theme_schedule.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member" "$CARGO_TARGET_DIR/release/examples/preview_theme"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --season themes/seasons/autumn --login --output "$RUNNER_TEMP/login-autumn.svg"
          cmp docs/images/login-autumn.svg "$RUNNER_TEMP/login-autumn.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --season themes/seasons/winter --login --output "$RUNNER_TEMP/login-winter.svg"
          cmp docs/images/login-winter.svg "$RUNNER_TEMP/login-winter.svg"
          python3 tools/render_theme_preview.py "$CARGO_TARGET_DIR/release/examples/preview_theme" --theme themes/base --season themes/seasons/winter --login --columns 40 --output "$RUNNER_TEMP/login-compact.svg"
          cmp docs/images/login-compact.svg "$RUNNER_TEMP/login-compact.svg"
          python3 tools/smoke_local_console.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_room_reader.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_unicode_subjects.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_modern_terminals.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_kitty_graphics.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_native_graphics.py "$CARGO_TARGET_DIR/release/faction-client"
          cargo build -p faction-articles --examples --release --locked
          python3 tools/check_article_interop.py "$CARGO_TARGET_DIR/release/examples/emit_fixture"
          python3 tools/smoke_local_chat.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_export_restore.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_member_worker.py "$CARGO_TARGET_DIR/release/faction" "$CARGO_TARGET_DIR/release/faction-member"
          python3 tools/smoke_broker_lifecycle.py "$CARGO_TARGET_DIR/release/faction-broker"
          python3 tools/smoke_credential_budget.py "$CARGO_TARGET_DIR/release/faction"

      - name: Validate articles with original offline INN
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/faction-target
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          umask 077
          python3 - "$RUNNER_TEMP/inn-2.7.4.tar.gz" <<'PY'
          import sys, urllib.request
          from pathlib import Path
          from tools.build_inn_reference import URL, SHA256
          import hashlib
          raw = urllib.request.urlopen(URL, timeout=30).read(10 * 1024 * 1024 + 1)
          assert len(raw) <= 10 * 1024 * 1024 and hashlib.sha256(raw).hexdigest() == SHA256
          Path(sys.argv[1]).write_bytes(raw)
          PY
          python3 tools/build_inn_reference.py --archive "$RUNNER_TEMP/inn-2.7.4.tar.gz" --work-dir "$RUNNER_TEMP/inn-reference"
          python3 tools/check_inn_articles.py --reference-dir "$RUNNER_TEMP/inn-reference" --examples "$CARGO_TARGET_DIR/release/examples"
