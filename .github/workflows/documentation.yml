name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the public repository revision
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Validate documentation, policies, and archive
        run: |
          python3 tools/check_repository.py
          python3 tools/model_link_budget.py --check
          python3 tools/measure_text_replay.py --check
          python3 tools/measure_buffer_probe.py --check
          python3 tools/measure_native_sessions.py --check
          python3 experiments/009-local-storage/probe.py --check
          python3 experiments/023-netbsd-dependencies/verify_evidence.py
          python3 tools/probe_lua_boundary.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate the local Rust core and real terminal flow
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/faction-target
          RUSTUP_TOOLCHAIN: 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          python3 tools/check_rust_dependencies.py
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
          cargo test --workspace --locked --release
          cargo build --workspace --locked --release
          python3 tools/smoke_local_console.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_local_chat.py "$CARGO_TARGET_DIR/release/faction"
          python3 tools/smoke_export_restore.py "$CARGO_TARGET_DIR/release/faction"
