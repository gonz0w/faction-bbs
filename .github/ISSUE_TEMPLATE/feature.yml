name: Product / design proposal
description: Propose bounded behavior consistent with the BBS direction.
title: "Design: "
labels: ["type:design", "status:needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and desired outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and boundaries
      description: State what remains local, approval requirements, privacy, terminal behavior, and deferred work.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues and dependencies
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
